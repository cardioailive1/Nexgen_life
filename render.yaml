# render.yaml — Render.com Blueprint
# Deploy NexGenLife with one click: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nexgenlife
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss && node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexgenlife-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Fill these in manually in Render dashboard:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_PROFESSIONAL_PRICE_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        value: https://nesgenlife.studio
      - key: APP_URL
        value: https://nexgenlife.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://nesgenlife.studio,https://nexgenlife.onrender.com
      - key: SUPPORT_EMAIL
        value: support@corverxis.com
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_MAX
        value: "500"
      - key: AUDIT_LOG_RETENTION_DAYS
        value: "2555"
      - key: DATA_RETENTION_DAYS
        value: "2555"

databases:
  - name: nexgenlife-db
    databaseName: nexgenlife
    user: nexgenlife
    region: oregon
    plan: free
    postgresMajorVersion: 16
